[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coreguitar"
version = "0.1.0"
description = "Personal guitar practice feedback: post-recording analysis of short, clean, single-note exercises."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "mir_eval>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
notebook = ["matplotlib>=3.7", "jupyter"]
crepe = ["torch", "torchcrepe"]

[project.scripts]
coreguitar = "coreguitar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
